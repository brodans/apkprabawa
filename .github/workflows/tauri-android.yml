name: Tauri Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_PATH: /tmp/prabawa-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VITE_MIDTRANS_CLIENT_KEY: ${{ vars.VITE_MIDTRANS_CLIENT_KEY }}
      VITE_MIDTRANS_IS_PRODUCTION: ${{ vars.VITE_MIDTRANS_IS_PRODUCTION }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - name: Validate required GitHub secrets and variables
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=("ANDROID_KEY_ALIAS")
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=("ANDROID_KEY_PASSWORD")
          [[ -n "$VITE_API_BASE_URL" ]] || missing+=("VITE_API_BASE_URL (Actions variable)")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub Actions configuration: ${missing[*]}"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: false
      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          packages=("platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973")
          for attempt in 1 2 3; do
            echo "Installing Android SDK packages (attempt ${attempt}/3)..."
            if sdkmanager --sdk_root="${ANDROID_HOME}" "${packages[@]}"; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              echo "::warning::sdkmanager failed; clearing partial downloads before retry."
              rm -rf "${ANDROID_HOME}/temp" "${HOME}/.android/cache"
            fi
          done
          exit 1
      - run: npm ci
      - name: Initialize Android project
        run: npm run tauri:android:init
      - name: Decode and verify Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          node -e "const fs = require('fs'); fs.writeFileSync('/tmp/prabawa-release.jks', Buffer.from(process.env.ANDROID_KEYSTORE_BASE64, 'base64'));"
          ls -l /tmp/prabawa-release.jks
      - name: Build Android APK
        run: npm run tauri:android:build
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: prabawa-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
